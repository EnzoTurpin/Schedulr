name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution par branche : annule les précédentes encore en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Qualité (lint, format, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Le client Prisma est un prérequis du typecheck : le code importe des
      # types générés depuis src/generated/prisma.
      - run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Formatage
        run: pnpm format:check

      - name: Vérification des types
        run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schedulr_test
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schedulr_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schedulr_shadow
      AUTH_SECRET: secret-de-test-uniquement-32-caracteres-minimum
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NOTIFICATIONS_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Préparer les bases annexes
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c 'CREATE DATABASE schedulr_shadow;'
          for db in schedulr_test schedulr_shadow; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d "$db" \
              -c 'CREATE EXTENSION IF NOT EXISTS btree_gist;'
          done

      - run: pnpm db:generate

      # Garde-fou de l'ADR-0004 : échoue si le schéma Prisma a dérivé des
      # migrations SQL — c'est ainsi qu'on détecte la disparition de la
      # contrainte d'exclusion posée à la main.
      # Le dossier est `prisma/schema/migrations` : avec un schéma
      # multi-fichiers, Prisma place les migrations à côté du dossier de schéma.
      # L'étape échoue si elles disparaissent, plutôt que d'être sautée en
      # silence — le garde-fou ne doit jamais se désactiver tout seul.
      - name: Dérive de schéma Prisma
        run: |
          test -d prisma/schema/migrations
          pnpm db:drift

      - name: Appliquer les migrations
        run: pnpm db:deploy

      - name: Tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      # Le build importe env.server.ts : des valeurs factices mais valides
      # suffisent, aucune connexion n'est ouverte à la compilation.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schedulr_build
      AUTH_SECRET: secret-de-build-uniquement-32-caracteres-minimum
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NOTIFICATIONS_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

  e2e:
    name: Tests de bout en bout
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schedulr_e2e
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schedulr_e2e
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schedulr_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Préparer la base
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d schedulr_e2e \
            -c 'CREATE EXTENSION IF NOT EXISTS btree_gist;'
          pnpm db:deploy

      - name: Installer le navigateur
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # Trace et captures du premier échec : c'est ce qui permet de
      # diagnostiquer un test rouge sans pouvoir le reproduire localement.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exigence du CLAUDE.md : audit à chaque PR.
      #
      # Bloquant sur les dépendances de **production** uniquement. Motif : la
      # seule vulnérabilité connue restante (brace-expansion, déni de service)
      # n'est atteinte que par ESLint et la couverture Vitest, sur des motifs
      # glob que nous écrivons nous-mêmes — aucune entrée utilisateur ne les
      # atteint. Elle n'est corrigée que sur la branche 5.x, dont l'API rompt
      # avec `minimatch` : forcer la mise à jour casse l'outillage sans rien
      # sécuriser.
      - name: Audit des dépendances de production
        run: pnpm audit --prod --audit-level high

      # Informatif : signale les avis touchant l'outillage sans bloquer la PR.
      - name: Audit complet (non bloquant)
        continue-on-error: true
        run: pnpm audit --audit-level high
